name: cv-adapter

x-app-environment: &app-environment
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cv_adapter
  REDIS_URL: redis://redis:6379
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  NODE_ENV: production

services:
  postgres:
    image: postgres:16
    container_name: cv-adapter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cv_adapter
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cv_adapter']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: cv-adapter-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    image: cv-adapter-api
    environment:
      <<: *app-environment
      PORT: '3001'
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: cv-adapter-api
    pull_policy: never
    command: ['node', 'apps/api/dist/apps/api/src/main.worker.js']
    environment:
      <<: *app-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    image: cv-adapter-web
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: cv_adapter_postgres_data
  redis_data:
    name: cv_adapter_redis_data
